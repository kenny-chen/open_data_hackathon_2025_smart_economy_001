<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>AIGIS Retail Bond Planning Tool - 零售債券規劃工具</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @font-face {
            font-family: '思源宋體';
            src: url('data/思源宋體.woff2') format('woff2');
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    gridTemplateColumns: {
                        '20': 'repeat(20, minmax(0, 1fr))'
                    },
                    fontFamily: {
                        'hei': ['Microsoft JhengHei', '微軟正黑體', '微软雅黑', 'sans-serif'],
                        'nav': ['思源宋體', 'Times New Roman', 'SimSun', '宋体', 'serif']
                    }
                }
            }
        }
    </script>
</head>
<body class="m-0 p-0 font-hei">
    <nav class="bg-white shadow-md h-10 flex items-center px-4">
        <h1 class="text-lg font-bold text-gray-800 font-nav">AIGIS Retail Bond Planning Tool - 零售債券規劃工具</h1>
    </nav>
    <div class="grid grid-cols-20" style="height: calc(100vh - 2.5rem);">
        <!-- left column (5 cols) -->
        <div class="col-span-5 grid grid-rows-[1fr_1fr_1fr_2fr] p-2.5 gap-2">
            <div id="chart">
                <canvas id="debtChart"></canvas>
            </div>
            <div id="revenueChart">
                <canvas id="revenueCanvas"></canvas>
            </div>
            <div id="balanceChart">
                <canvas id="balanceCanvas"></canvas>
            </div>
            <div id="expenditureChart">
                <canvas id="expenditureCanvas"></canvas>
            </div>
        </div>
        
        <!-- middle column (10 cols) -->
        <div class="col-span-10 grid grid-rows-[1fr_1fr_auto]">
            <div id="map"></div>
            <div id="bubbleChart">
                <canvas id="bubbleCanvas"></canvas>
            </div>
            <div id="district-info" class="p-2.5 text-xs h-16">Loading districts...</div>
        </div>
        
        <!-- right column (5 cols) -->
        <div class="col-span-5 grid grid-rows-5 p-2.5 gap-2">
            <div id="bondChart">
                <canvas id="bondCanvas"></canvas>
            </div>
            <div id="birthChart">
                <canvas id="birthCanvas"></canvas>
            </div>
            <div id="hkmaChart">
                <canvas id="hkmaCanvas"></canvas>
            </div>
            <div id="hkmaTotalChart">
                <canvas id="hkmaTotalCanvas"></canvas>
            </div>
            <div id="apyChart">
                <canvas id="apyCanvas"></canvas>
            </div>
        </div>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
    <script>
        // Initialize map centered on Hong Kong
        var map = L.map('map').setView([22.3193, 114.1694], 11);
        
        // Add gray tile layer
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '© OpenStreetMap © CartoDB',
            subdomains: 'abcd'
        }).addTo(map);
        
        // Load IMF Global Debt Database
        Papa.parse('data/國際貨幣基金組織-全球債務數據庫-v2.csv', {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                const labels = results.meta.fields.slice(1); // Exclude "Year"
                const lastRow = results.data[results.data.length - 1];
                
                // Create array of {label, value} pairs and sort descending
                const dataArray = labels.map(label => ({
                    label: label,
                    value: parseFloat(lastRow[label]) || 0
                })).sort((a, b) => b.value - a.value);
                
                const sortedLabels = dataArray.map(item => item.label);
                const sortedData = dataArray.map(item => item.value);
                const backgroundColors = sortedLabels.map(label => 
                    label.includes('Hong Kong') || label.includes('香港') ? '#1f2937' : '#d1d5db'
                );
                new Chart(document.getElementById('debtChart'), {
                    type: 'bar',
                    data: {
                        labels: sortedLabels,
                        datasets: [{
                            label: 'Debt%',
                            data: sortedData,
                            backgroundColor: backgroundColors
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { 
                            legend: { display: false },
                            title: { display: true, text: ['International Monetary Fund – Global Debt Database 2025 (Total Debt / GDP)', '國際貨幣基金組織-全球債務數據庫2025 (總債務/國內生產總值)'] }
                        },
                        scales: {
                            x: { ticks: { maxRotation: 90, font: { size: 7 } } },
                            y: { ticks: { font: { size: 7 } } }
                        }
                    }
                });
            },
            error: function(error) {
                console.error('Papa Parse error:', error);
            }
        });
        
        // Load Government Revenue and Expenditure Data
        Papa.parse('data/政府統計處-政府的收入和開支.csv', {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                const years = results.data.map(row => row['財政年度']);
                const totalRevenue = results.data.map(row => parseFloat(row['總收入']) || 0);
                const totalExpenditure = results.data.map(row => parseFloat(row['期內實際開支']) || 0);
                const fiscalBalance = results.data.map(row => parseFloat(row['財政差距']) || 0);
                
                // Revenue vs Expenditure Chart
                new Chart(document.getElementById('revenueCanvas'), {
                    type: 'line',
                    data: {
                        labels: years,
                        datasets: [{
                            label: 'Total Revenue (HK$ million) 總收入(百萬港元)',
                            data: totalRevenue,
                            borderColor: '#d1d5db',
                            backgroundColor: '#d1d5db',
                            tension: 0.1
                        }, {
                            label: 'Total Expenditure (HK$ million) 實際開支(百萬港元)',
                            data: totalExpenditure,
                            borderColor: '#1f2937',
                            backgroundColor: '#1f2937',
                            tension: 0.1
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            title: { display: true, text: ['Government revenue and expenditure under the General Revenue Account 1992~2024', '香港政府收入與開支1992~2024'] }
                        },
                        scales: {
                            x: { ticks: { maxRotation: 45, font: { size: 6 } } },
                            y: { ticks: { font: { size: 7 } } }
                        }
                    }
                });
                
                // Fiscal Balance Chart
                new Chart(document.getElementById('balanceCanvas'), {
                    type: 'line',
                    data: {
                        labels: years,
                        datasets: [{
                            label: 'Fiscal Balance (HK$ million) 財政差距 (百萬港元)',
                            data: fiscalBalance,
                            borderColor: '#1f2937',
                            backgroundColor: '#1f2937',
                            tension: 0.1
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            title: { display: true, text: ['Hong Kong Government Fiscal Balance 1992~2024', '香港政府財政差距1992~2024'] }
                        },
                        scales: {
                            x: { ticks: { maxRotation: 45, font: { size: 6 } } },
                            y: { 
                                ticks: { font: { size: 7 } },
                                grid: { color: function(context) {
                                    return context.tick.value === 0 ? '#000' : '#e5e7eb';
                                }}
                            }
                        }
                    }
                });
            },
            error: function(error) {
                console.error('Papa Parse error:', error);
            }
        });
        
        // Load Government Expenditure Data
        Papa.parse('data/政府統計處-政府開支-一般收入帳目及各基金-v2.csv', {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                const ExpenditureData = results.data.filter(row => !Object.values(row)[0].includes('總額') && !Object.values(row)[0].includes('總計'));
                const ExpenditureLabels = ExpenditureData.map(row => Object.values(row)[0]);
                const ExpenditureValues = ExpenditureData.map(row => parseFloat(row['2023-2024']) || 0);
                
                new Chart(document.getElementById('expenditureCanvas'), {
                    type: 'doughnut',
                    data: {
                        labels: ExpenditureLabels,
                        datasets: [{
                            data: ExpenditureValues,
                            backgroundColor: ExpenditureLabels.map(label => 
                                label.includes('基本工程儲備基金') ? '#9ca3af' : '#e5e7eb'
                            )
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            title: { display: true, text: ['Hong Kong Government Expenditure 2023-2024 (HK$ million)', '香港政府開支2023-2024 (百萬港元)'] },
                            legend: { display: false },
                            datalabels: {
                                display: true,
                                color: '#1f2937',
                                font: { size: 10 },
                                formatter: function(value, context) {
                                    const label = ExpenditureLabels[context.dataIndex];
                                    const parts = label.split('-');
                                    return parts[parts.length - 1].trim();
                                }
                            }
                        }
                    },
                    plugins: [ChartDataLabels]
                });
            },
            error: function(error) {
                console.error('Papa Parse error:', error);
            }
        });
        
        function updateVisibleDistricts() {
            const bounds = map.getBounds();
            const visibleDistricts = [];
            
            geoJsonLayer.eachLayer(function(layer) {
                if (bounds.intersects(layer.getBounds())) {
                    visibleDistricts.push(layer.feature.properties);
                }
            });
            
            const districtNames = visibleDistricts.map(props => `${props.District} ${props.地區}`).join(', ');
            let html = `Visible Districts (${visibleDistricts.length}): ${districtNames}`;
            document.getElementById('district-info').innerHTML = html;
        }
        
        // Load Green Bond District Data for Choropleth
        Papa.parse('data/香港金融管理局-綠色債券報告2025-已填地區.csv', {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                // Count projects and store project names by district
                const districtCounts = {};
                const districtProjects = {};
                results.data.forEach(row => {
                    const district = row['地區'];
                    const projectName = row['項目名稱'];
                    districtCounts[district] = (districtCounts[district] || 0) + 1;
                    if (!districtProjects[district]) districtProjects[district] = [];
                    districtProjects[district].push(projectName);
                });
                
                const maxCount = Math.max(...Object.values(districtCounts));
                
                // Load and add GeoJSON with choropleth styling
                fetch('data/民政事務總署-地方行政區分界.json')
                    .then(response => response.json())
                    .then(data => {
                        geoJsonLayer = L.geoJSON(data, {
                            style: function(feature) {
                                const count = districtCounts[feature.properties.地區] || 0;
                                const intensity = count / maxCount;
                                let fillColor = '#d1d5db'; // gray-300 for no projects
                                if (count > 0) {
                                    // Higher values = lighter colors (gray-900 to gray-500)
                                    const grayValue = Math.floor(900 - (intensity * 400)); // 900 to 500
                                    const grayColors = {
                                        900: '#111827', 800: '#1f2937', 700: '#374151',
                                        600: '#4b5563', 500: '#6b7280'
                                    };
                                    const roundedGray = Math.round(Math.max(500, Math.min(900, grayValue)) / 100) * 100;
                                    fillColor = grayColors[roundedGray] || '#6b7280';
                                }
                                return {
                                    color: '#ffffff',
                                    weight: 1,
                                    fillColor: fillColor,
                                    fillOpacity: 0.8
                                };
                            },
                            onEachFeature: function(feature, layer) {
                                const count = districtCounts[feature.properties.地區] || 0;
                                
                                // Add permanent label on polygon
                                const center = layer.getBounds().getCenter();
                                const label = L.marker(center, {
                                    icon: L.divIcon({
                                        className: 'district-label',
                                        html: `<div class="text-white text-xs text-center font-bold" style="text-shadow: 1px 1px 2px black;">${feature.properties.District}<br>${feature.properties.地區}<br>(${count})</div>`,
                                        iconSize: [120, 40],
                                        iconAnchor: [40, 20]
                                    })
                                }).addTo(map);
                                
                                layer.on('click', function() {
                                    const projectNames = districtProjects[feature.properties.地區] || [];
                                    const projectList = projectNames.length > 0 ? ', ' + projectNames.join(', ') : '';
                                    document.getElementById('district-info').innerHTML = `${feature.properties.District} ${feature.properties.地區} (${feature.properties.地區號碼})<br>Green Bond Projects: ${count}${projectList}`;
                                });
                            }
                        }).addTo(map);
                        
                        // Update visible districts on map move/zoom
                        map.on('moveend zoomend', updateVisibleDistricts);
                        updateVisibleDistricts(); // Initial load
                    });
            },
            error: function(error) {
                console.error('Green Bond data error:', error);
            }
        });
        
        // Load Retail Bond Subscription Data
        Papa.parse('data/前沿資本-零售債券-市場認購.csv', {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                const dates = results.data.map(row => row['Datetime']);
                const subscriptionAmount = results.data.map(row => parseFloat(row['Total Subscription Amount (HKD Million)']) || 0);
                const issuanceAmount = results.data.map(row => parseFloat(row['Issuance Amount(HKD Million)']) || 0);
                const instruments = results.data.map(row => row['Instrument']);
                const interestRates = results.data.map(row => row['Annual Interest Rate']);
                
                // Retail Bond Subscription Chart
                new Chart(document.getElementById('bondCanvas'), {
                    type: 'line',
                    data: {
                        labels: dates,
                        datasets: [{
                            label: 'Total Subscription Amount (HKD Million) 總認購金額(百萬港元)',
                            data: subscriptionAmount,
                            borderColor: '#1f2937',
                            backgroundColor: '#1f2937',
                            tension: 0.1,
                            datalabels: {
                                display: true,
                                align: 'top',
                                anchor: 'end',
                                color: '#1f2937',
                                font: { size: 10 },
                                formatter: function(value, context) {
                                    const index = context.dataIndex;
                                    return `${instruments[index]} ${interestRates[index]}%`;
                                }
                            }
                        }, {
                            label: 'Issuance Amount (HKD Million) 發行金額(百萬港元)',
                            data: issuanceAmount,
                            borderColor: '#d1d5db',
                            backgroundColor: '#d1d5db',
                            tension: 0.1,
                            datalabels: {
                                display: false
                            }
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            title: { display: true, text: ['Hong Kong Retail Bond Market Subscription 2022~2025', '香港零售債券市場認購情況2022~2025'] },
                            datalabels: {
                                display: false
                            }
                        },
                        scales: {
                            x: { ticks: { maxRotation: 45, font: { size: 6 } } },
                            y: { ticks: { font: { size: 7 } } }
                        }
                    },
                    plugins: [ChartDataLabels]
                });
            },
            error: function(error) {
                console.error('Papa Parse error:', error);
            }
        });
        
        // Load Birth Population Data
        Papa.parse('data/政府統計處-各年出生人口.csv', {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                const years = results.data.map(row => row['year_of_birth']);
                const population = results.data.map(row => parseFloat(row['num_of_population']) || 0);
                
                // Split data by 1966
                const dataBefore1966 = years.map((year, i) => parseInt(year) <= 1966 ? population[i] : null);
                const dataAfter1966 = years.map((year, i) => parseInt(year) >= 1966 ? population[i] : null);
                
                // Birth Population Chart
                new Chart(document.getElementById('birthCanvas'), {
                    type: 'line',
                    data: {
                        labels: years,
                        datasets: [{
                            label: 'Before 1966 一九六六年前',
                            data: dataBefore1966,
                            borderColor: '#1f2937',
                            backgroundColor: '#1f2937',
                            tension: 0.1,
                            spanGaps: false,
                            datalabels: {
                                display: true,
                                align: 'top',
                                color: '#1f2937',
                                font: { size: 8 },
                                formatter: function(value) {
                                    return value ? value : '';
                                }
                            }
                        }, {
                            label: 'After 1966 一九六六年後',
                            data: dataAfter1966,
                            borderColor: '#d1d5db',
                            backgroundColor: '#d1d5db',
                            tension: 0.1,
                            spanGaps: false,
                            datalabels: {
                                display: true,
                                align: 'top',
                                color: '#d1d5db',
                                font: { size: 8 },
                                formatter: function(value) {
                                    return value ? value : '';
                                }
                            }
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            title: { display: true, text: ['Hong Kong Birth Population 1961~2017', '香港各年出生人口1961~2017'] },
                            datalabels: {
                                display: false
                            }
                        },
                        scales: {
                            x: { ticks: { maxRotation: 45, font: { size: 6 } } },
                            y: { ticks: { font: { size: 7 } } }
                        }
                    },
                    plugins: [ChartDataLabels]
                });
            },
            error: function(error) {
                console.error('Papa Parse error:', error);
            }
        });
        
        // Load HKMA Deposits Data
        fetch('data/香港金融管理局-港元及外幣存款.json')
            .then(response => response.json())
            .then(result => {
                const allData = result.result.records;
                const data = allData.filter(row => parseInt(row.end_of_month.split('-')[0]) > 2020);
                const dates = data.map(row => row.end_of_month).reverse();
                const demandHKD = data.map(row => parseFloat(row.lb_demand_hkd) || 0).reverse();
                const timeHKD = data.map(row => parseFloat(row.lb_time_hkd) || 0).reverse();
                const totalHKD = data.map(row => parseFloat(row.lb_total_hkd) || 0).reverse();
                
                new Chart(document.getElementById('hkmaCanvas'), {
                    type: 'line',
                    data: {
                        labels: dates,
                        datasets: [{
                            label: 'Demand Deposits(Million HKD) 活期存款(百萬港元)',
                            data: demandHKD,
                            borderColor: '#d1d5db',
                            backgroundColor: '#d1d5db',
                            tension: 0.1
                        }, {
                            label: 'Time Deposits(Million HKD) 定期存款(百萬港元)',
                            data: timeHKD,
                            borderColor: '#1f2937',
                            backgroundColor: '#1f2937',
                            tension: 0.1
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            title: { display: true, text: ['Hong Kong Monetary Authority HKD Deposits 2017~2025', '香港金管局港元存款2017~2025'] }
                        },
                        scales: {
                            x: { ticks: { maxRotation: 45, font: { size: 6 } } },
                            y: { ticks: { font: { size: 7 } } }
                        }
                    }
                });
                
                new Chart(document.getElementById('hkmaTotalCanvas'), {
                    type: 'line',
                    data: {
                        labels: dates,
                        datasets: [{
                            label: 'Total HKD Deposits(Million HKD) 港元存款總計(百萬港元)',
                            data: totalHKD,
                            borderColor: '#1f2937',
                            backgroundColor: '#1f2937',
                            tension: 0.1
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            title: { display: true, text: ['Hong Kong Monetary Authority Total HKD Deposits 2021~2025', '香港金管局港元存款總計2021~2025'] }
                        },
                        scales: {
                            x: { ticks: { maxRotation: 45, font: { size: 6 } } },
                            y: { ticks: { font: { size: 7 } } }
                        }
                    }
                });
            })
            .catch(error => console.error('HKMA data error:', error));
        
        // Load Money Market Fund APY Data
        fetch('data/香港交易所-泰康開泰港元貨幣基金.json')
            .then(response => response.json())
            .then(data => {
                const monthlyData = [];
                for (let i = 1; i < data.length; i++) {
                    const prevNav = data[i-1][1];
                    const currNav = data[i][1];
                    const date = new Date(data[i][0]);
                    const monthlyReturn = (currNav / prevNav) - 1;
                    const apy = (Math.pow(1 + monthlyReturn, 52) - 1) * 100;
                    if (i % 4 === 0) {
                        monthlyData.push({ date: date.toISOString().slice(0, 7), apy: apy });
                    }
                }
                
                const dates = monthlyData.map(d => d.date);
                const apyValues = monthlyData.map(d => d.apy);
                
                new Chart(document.getElementById('apyCanvas'), {
                    type: 'line',
                    data: {
                        labels: dates,
                        datasets: [{
                            label: 'Monthly APY (%) 月度年化收益率(%)',
                            data: apyValues,
                            borderColor: '#1f2937',
                            backgroundColor: '#1f2937',
                            tension: 0.1
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            title: { display: true, text: ['Tai Kang Kai Tai HKD Money Market Fund APY 2021~2025', '泰康開泰港元貨幣基金年化收益率2021~2025'] }
                        },
                        scales: {
                            x: { ticks: { maxRotation: 45, font: { size: 6 } } },
                            y: { ticks: { font: { size: 7 } } }
                        }
                    }
                });
            })
            .catch(error => console.error('APY data error:', error));
        
        // Load Green Bond Projects Data
        Papa.parse('data/香港金融管理局-綠色債券報告2025-項目.csv', {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                const categoryColors = {
                    '綠色建築': '#374151',
                    '水及廢水管理': '#4b5563',
                    '廢物管理及資源回收': '#6b7280',
                    '能源效益和節約能源': '#9ca3af',
                    '污染預防及管控': '#d1d5db',
                    '適應氣候變化': '#e5e7eb'
                };
                
                const categories = [...new Set(results.data.map(row => row['合資格類別']))];
                const datasets = categories.map(category => {
                    const categoryData = results.data
                        .filter(row => row['合資格類別'] === category)
                        .map(row => ({
                            x: parseInt(row['完成/預計 完成年份']) || 0,
                            y: parseFloat(row['截至2024- 25年度的 開支 (百萬港元)'].replace(/,/g, '')) || 0,
                            r: Math.sqrt(parseFloat(row['項目總預算 (百萬港元)'].replace(/,/g, '')) || 0) / 15,
                            label: row['項目名稱']
                        }))
                        .filter(d => d.x > 0 && d.y > 0);
                    
                    return {
                        label: category,
                        data: categoryData,
                        backgroundColor: categoryColors[category] || '#9ca3af',
                        borderColor: '#ffffff'
                    };
                });
                
                new Chart(document.getElementById('bubbleCanvas'), {
                    type: 'bubble',
                    data: {
                        datasets: datasets
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            title: { display: true, text: ['Retail Bond Projects 2018~2040: Completion Year vs Total Budget (Million HKD)', '零售債券項目2018~2040: 完成年份vs總預算(百萬港元)'] },
                            tooltip: {
                                callbacks: {
                                    title: function(context) {
                                        return context[0].raw.label;
                                    }
                                }
                            }
                        },
                        scales: {
                            x: { 
                                title: { display: true, text: 'Completion Year 完成/預計完成年份' },
                                ticks: { font: { size: 8 } }
                            },
                            y: { 
                                title: { display: true, text: 'Total Budget (Million HKD) 項目總預算(百萬港元)' },
                                ticks: { font: { size: 8 } }
                            }
                        }
                    }
                });
            },
            error: function(error) {
                console.error('Green Bond data error:', error);
            }
        });
    </script>
</body>
</html>
